name: Publish engine image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  deployments: write
  packages: write

concurrency:
  group: publish-engine-production
  cancel-in-progress: false

jobs:
  publish:
    # workflow_run also fires for pull-request CI. Publish only a successful
    # push to the protected main branch, using the exact commit that CI tested.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Linux AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/adept-industries/adept-engine:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=Adept Engine
          cache-from: type=gha,scope=adept-engine
          cache-to: type=gha,mode=max,scope=adept-engine

  deploy:
    name: Deploy tested engine image to production
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Create exact-SHA production deployment
        id: create-deployment
        env:
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments" \
            --data "$(jq -n \
              --arg ref "${DEPLOYMENT_SHA}" \
              --arg description "Adept Engine AWS production rollout" \
              '{ref: $ref, environment: "production", description: $description, auto_merge: false, required_contexts: [], transient_environment: false, production_environment: true}')")"
          deployment_id="$(jq -er '.id' <<<"${response}")"
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Deploy to AWS Lightsail and verify health
        id: deploy-to-aws
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -eu
            cd /opt/adept
            sed -i "s|^ENGINE_IMAGE=.*|ENGINE_IMAGE=ghcr.io/adept-industries/adept-engine:sha-${{ github.event.workflow_run.head_sha }}|" .env.production
            sudo docker compose --env-file .env.production -f compose.yaml pull engine-api engine-worker
            sudo docker compose --env-file .env.production -f compose.yaml up -d --no-deps engine-api engine-worker
            sudo docker compose --env-file .env.production -f compose.yaml ps
            ready=false
            for attempt in $(seq 1 60); do
              if sudo docker compose --env-file .env.production -f compose.yaml exec -T engine-api python -c 'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://localhost:8000/ready", timeout=3)); assert payload.get("status") == "READY" and payload.get("schemaVersion") in {"13", "14"}, payload'; then
                ready=true
                break
              fi
              sleep 2
            done
            test "${ready}" = true
            sudo docker compose --env-file .env.production -f compose.yaml ps --status running --services | grep -qx engine-worker
            echo "Engine Deployment Complete!"

      - name: Report production deployment result
        if: ${{ always() && steps.create-deployment.outputs.deployment_id != '' }}
        env:
          DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.deployment_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy-to-aws.outcome }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "${DEPLOY_OUTCOME}" == "success" ]]; then
            state=success
          fi
          jq -n \
            --arg state "${state}" \
            --arg log_url "${RUN_URL}" \
            '{state: $state, environment: "production", environment_url: "https://adeptindustries.dev", log_url: $log_url, auto_inactive: true}' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
              --data @- > /dev/null
